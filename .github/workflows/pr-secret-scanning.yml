---
name: PR Secret and Sensitivity Scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          version: "3.96.0"
          extra_args: --results=verified,unknown

      - name: Run Sensitivity Smell
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        id: sensitivity
        uses: KingBain/sensitivity-smell@v1.1.1
        with:
          fail-on: NONE

      - name: Upload sensitivity reports
        if: ${{ !cancelled() && steps.sensitivity.outputs.report-directory != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sensitivity-smell-results
          path: ${{ steps.sensitivity.outputs.report-directory }}
          retention-days: 7
          if-no-files-found: error
